name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: devops-eks
  IMAGE_NAME: my-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  
jobs:

  #################################
  # 1. BUILD & TEST
  #################################
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

################################# 
# 2. SONARQUBE SCAN
#################################
  sonarqube:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build project
      run: mvn clean install

    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=my-project-key \
          -Dsonar.host.url=http://ec2-13-217-15-63.compute-1.amazonaws.com:9000/ \
          -Dsonar.login=$SONAR_TOKEN
          
  ###########################################
  # 3. BUILD DOCKER IMAGE & TRIVY SCAN
  ###########################################
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build an image from Dockerfile
        run: docker build -t docker.io/my-organization/my-app:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  #################################
  # 4. PUSH TO DOCKERHUB
  #################################
  push_server_image :
    name : Push Docker image to Docker Hub - server
    runs-on : ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Build the JAR first (THIS FIXES YOUR ERROR)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Optional: verify jar exists (good for debugging)
      - name: List target folder
        run: ls -la target

      # ✅ Correct step structure
      - name: Deploy container to registry
        uses: slabstech/action-deploy-container-to-registry@v0.0.1
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-repository: ${{ github.repository }}
          project-name: geoapp
          service-name: server-dropwizard
          dockerfile-path: ~/GEO-APP/Full_CICD_pipeline_code/ .

  #################################
  # 5. DEPLOY TO EKS
  #################################
  deploy:
    runs-on: ubuntu-latest
    #needs: push-artifact

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: $AWS_REGION

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/my-app \
          my-app=${{ secrets.ARTIFACTORY_URL }}/docker/$IMAGE_NAME:${{ github.sha }}

          kubectl rollout status deployment/my-app